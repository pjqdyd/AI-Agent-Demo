packages:
  # 所有 packages 下的子包
  - 'packages/*'
  # 可选：apps 放应用项目（前端页面、后端服务）
  - 'apps/*'
  # 排除目录（可选）
  # - '!packages/**/test'
allowBuilds:
  core-js: true
  core-js-pure: true
  es5-ext: set this to true or false
  esbuild: true
# 强制 human-id 降到 CJS 版本（兼容 Node 18 上的 @changesets/write CJS require）
overrides:
  human-id: ^2.0.1
